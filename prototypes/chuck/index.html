<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive mobile prototype for Monash DataConnect.">
  <title>Monash DataConnect · Interactive prototype</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1b1b1f;
      --muted: #62626b;
      --red: #a50000;
      --canvas: #f3f1f0;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(165, 0, 0, 0.09), transparent 31rem),
        radial-gradient(circle at 90% 85%, rgba(0, 101, 145, 0.08), transparent 28rem),
        var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .page {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(17rem, 28rem) auto;
      align-items: center;
      justify-content: center;
      gap: clamp(2rem, 7vw, 7rem);
      padding: 3rem;
    }
    .intro { max-width: 27rem; }
    .eyebrow {
      margin: 0 0 1rem;
      color: var(--red);
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 5vw, 4.5rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }
    .intro > p:not(.eyebrow) {
      margin: 1.35rem 0;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.65;
    }
    .controls { display: grid; gap: 0.75rem; margin-top: 1.8rem; }
    label { color: var(--muted); font-size: 0.82rem; font-weight: 650; }
    select, .control-button {
      width: 100%;
      min-height: 2.9rem;
      border: 1px solid rgba(27, 27, 31, 0.14);
      border-radius: 0.8rem;
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink);
      font: inherit;
      padding: 0 0.9rem;
    }
    .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    .control-button { cursor: pointer; font-weight: 700; }
    .control-button.primary { border-color: var(--red); background: var(--red); color: white; }
    .hint { font-size: 0.78rem !important; line-height: 1.45 !important; }
    .device-stage { position: relative; }
    .phone {
      position: relative;
      width: min(393px, calc(100vw - 2rem));
      height: min(852px, calc(100dvh - 3rem));
      min-height: 620px;
      padding: 11px;
      border: 2px solid #414147;
      border-radius: 55px;
      background: #111114;
      box-shadow: 0 35px 80px rgba(24, 18, 18, 0.28), inset 0 0 0 1px #77777e;
    }
    .phone::before, .phone::after {
      content: "";
      position: absolute;
      left: -5px;
      width: 3px;
      border-radius: 3px 0 0 3px;
      background: #303034;
    }
    .phone::before { top: 150px; height: 70px; }
    .phone::after { top: 235px; height: 98px; }
    .dynamic-island {
      position: absolute;
      z-index: 3;
      top: 20px;
      left: 50%;
      width: 112px;
      height: 31px;
      border-radius: 18px;
      background: #08080a;
      transform: translateX(-50%);
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 43px;
      background: white;
    }
    @media (max-width: 800px) {
      body { overflow: hidden; background: white; }
      .page { display: block; min-height: 100dvh; padding: 0; }
      .intro { display: none; }
      .phone {
        width: 100vw;
        height: 100dvh;
        min-height: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .phone::before, .phone::after, .dynamic-island { display: none; }
      iframe { border-radius: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="intro" aria-labelledby="prototype-title">
      <p class="eyebrow">Capstone interactive prototype</p>
      <h1 id="prototype-title">Monash DataConnect</h1>
      <p>Collect local mobile-network data, discover global patterns and connect with classmates around the world.</p>

      <div class="controls">
        <label for="screen-picker">Jump to a prototype screen</label>
        <select id="screen-picker"><option value="onboarding.html">Onboarding</option>
<option value="sign-in.html">Sign in</option>
<option value="consent.html">Consent</option>
<option value="home.html">Home</option>
<option value="collect.html">Collect</option>
<option value="review.html">Review</option>
<option value="explore.html">Explore</option>
<option value="compare.html">Compare</option>
<option value="dataset.html">Dataset</option>
<option value="community.html">Community</option>
<option value="chat.html">Group chat</option>
<option value="discovery.html">Discovery</option>
<option value="profile.html">Profile</option></select>
        <div class="button-row">
          <button class="control-button primary" id="restart" type="button">Restart</button>
          <button class="control-button" id="open-screen" type="button">Open full screen</button>
        </div>
      </div>
      <p class="hint">Use the controls inside the phone to follow the main student journey. The phone content scrolls independently.</p>
    </section>

    <section class="device-stage" aria-label="iPhone prototype preview">
      <div class="phone">
        <div class="dynamic-island" aria-hidden="true"></div>
        <iframe id="prototype" src="prototype/onboarding.html" title="Monash DataConnect interactive prototype"></iframe>
      </div>
    </section>
  </main>
  <script>
    const frame = document.getElementById('prototype');
    const picker = document.getElementById('screen-picker');

    const show = (screen) => {
      frame.src = 'prototype/' + screen;
      picker.value = screen;
    };

    picker.addEventListener('change', () => show(picker.value));
    document.getElementById('restart').addEventListener('click', () => show('onboarding.html'));
    document.getElementById('open-screen').addEventListener('click', () => {
      window.open(frame.contentWindow.location.href, '_blank', 'noopener');
    });

    frame.addEventListener('load', () => {
      try {
        const current = frame.contentWindow.location.pathname.split('/').pop();
        if ([...picker.options].some((option) => option.value === current)) picker.value = current;
      } catch (_) {}
    });
  </script>
</body>
</html>
